<!-- Entry HTML for the 3D portfolio. Mounts the React app and provides meta tags / favicons. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/media/apple-touch-icon.png"
    />
    <link rel="manifest" href="/media/site.webmanifest" />

    <meta name="language" content="English" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/og-image.webp" />
    <meta
      property="og:description"
      content="Personal portfolio — explore my work in an immersive 3D world."
    />
    <meta
      name="description"
      content="Personal portfolio — explore my work in an immersive 3D world."
    />
    <title>Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
