<!-- Entry HTML for the 3D portfolio. Mounts the React app and provides meta tags / favicons. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/media/apple-touch-icon.png"
    />
    <link rel="manifest" href="/media/site.webmanifest" />

    <meta name="language" content="English" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/og-image.webp" />
    <meta
      property="og:description"
      content="Personal portfolio — explore my work in an immersive 3D world."
    />
    <meta
      name="description"
      content="Personal portfolio — explore my work in an immersive 3D world."
    />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Portfolio</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0b0b;
        color: #fff;
      }

      .boot-fallback {
        display: grid;
        min-height: 100vh;
        place-content: center;
        gap: 16px;
        font-family: sans-serif;
        text-align: center;
      }

      .boot-fallback a {
        color: #ff7700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <p>Loading portfolio…</p>
        <a href="/projects">View projects</a>
      </div>
    </div>
    <noscript>
      <div class="boot-fallback">
        <p>This portfolio uses JavaScript for its 3D experience.</p>
        <a href="/projects">View the project archive instead</a>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
